<!doctype html>
<meta charset="utf-8">
<title>TideCombat Offline Fixture</title>
<body style="background:#dc2314">
<script>
  document.addEventListener('keydown', event => {
    if (event.code === 'KeyW') document.body.style.background = '#11ba26';
  });
  document.addEventListener('keyup', event => {
    if (event.code === 'KeyW') document.body.style.background = '#dc2314';
  });
  document.addEventListener('mousedown', event => {
    if (event.button === 0) document.body.style.background = '#263cda';
  });
  document.addEventListener('wheel', event => {
    if (event.deltaY < 0) document.body.style.background = '#f29413';
  });
</script>
